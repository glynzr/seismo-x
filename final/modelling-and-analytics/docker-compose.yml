version: "3.9"

services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data

  airflow-webserver:
    build: .
    depends_on: [postgres]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DATA_DIR: /opt/airflow/data
      DB_PATH: /opt/airflow/seismo_raw_vault.duckdb
    volumes:
      - ./dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./data:/opt/airflow/data
      - ./dashboard:/opt/airflow/dashboard
      - ./seismo_raw_vault.duckdb:/opt/airflow/seismo_raw_vault.duckdb
    ports:
      - "8080:8080"
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
        --username admin
        --password admin
        --firstname admin
        --lastname admin
        --role Admin
        --email admin@example.com || true &&
      airflow webserver
      "

  airflow-scheduler:
    build: .
    depends_on: [airflow-webserver]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      DATA_DIR: /opt/airflow/data
      DB_PATH: /opt/airflow/seismo_raw_vault.duckdb
    volumes:
      - ./dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./data:/opt/airflow/data
      - ./dashboard:/opt/airflow/dashboard
      - ./seismo_raw_vault.duckdb:/opt/airflow/seismo_raw_vault.duckdb
    command: airflow scheduler

volumes:
  pgdata:
